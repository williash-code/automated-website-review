name: Daily Website Monitoring

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install playwright

      - name: Run website monitor
        run: node monitor.js

      - name: Read report
        id: report
        run: |
          if [ -f report.txt ]; then
            REPORT=$(cat report.txt)
            echo "report<<EOF" >> $GITHUB_OUTPUT
            echo "$REPORT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "report=No report generated" >> $GITHUB_OUTPUT
          fi
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_EMAIL }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Daily Website Monitoring Report - ${{ steps.report.outputs.date }}"
          to: shane@cybersecurityjoe.com
          from: ${{ secrets.GMAIL_EMAIL }}
          body: ${{ steps.report.outputs.report }}
          content_type: text/plain
